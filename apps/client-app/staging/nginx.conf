worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # This image has no upstreams. Fail closed for API, identity and business routes.
    location ~* ^/(api|pilot|auth|authentication|login|logout|register|signup|booking|bookings|reservations|payments|checkout|admin|staff|training|bunker)(/|$) {
      return 404;
    }

    location ~ /\. {
      return 404;
    }

    location = /service-worker.js {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      try_files $uri =404;
    }

    location = /icon.svg {
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location = / {
      try_files /index.html =404;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
