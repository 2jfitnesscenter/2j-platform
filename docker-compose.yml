services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: 2j_platform
      POSTGRES_USER: 2j_local
      POSTGRES_PASSWORD: 2j_local_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - 2j-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2j_local -d 2j_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  2j-platform-postgres:
